<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台 · 內容管理</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F2EB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2312151A'/%3E%3Crect x='6' y='6' width='20' height='20' fill='none' stroke='%23F5F2EB' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23C94F2B'/%3E%3C/svg%3E">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-brand">
      <span class="gate-mark" aria-hidden="true"></span>
      <span class="mono">Content Studio</span>
    </div>
    <h1 class="gate-title">站長登入</h1>
    <p class="gate-sub">輸入密碼以編輯網站內容。</p>

    <form id="loginForm" novalidate>
      <label class="field">
        <span class="field-label">密碼</span>
        <input type="password" id="pwInput" name="password" autocomplete="current-password" required
               placeholder="••••••••" aria-describedby="pwErr">
      </label>
      <p class="field-err" id="pwErr" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">登入</button>
    </form>

    <p class="gate-note">
      這是靜態網站的<b>前端密碼閘門</b>，用來阻擋一般訪客誤入，不是伺服器端驗證。
      真正的寫入權限由你的 GitHub Token 控制——沒有 Token 就算過了閘門也發布不了。
    </p>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="app" id="app" hidden>

  <aside class="side">
    <div class="side-head">
      <span class="side-mark" aria-hidden="true"></span>
      <div>
        <p class="side-title">Content Studio</p>
        <p class="side-sub mono" id="sideRepo">—</p>
      </div>
    </div>

    <nav class="side-nav" id="sideNav" aria-label="內容區塊">
      <button class="side-item" data-view="site" type="button"><span class="mono">01</span>網站設定</button>
      <button class="side-item" data-view="skills" type="button"><span class="mono">02</span>專業技能</button>
      <button class="side-item" data-view="interests" type="button"><span class="mono">03</span>興趣</button>
      <button class="side-item" data-view="life" type="button"><span class="mono">04</span>生活</button>
      <button class="side-item" data-view="travel" type="button"><span class="mono">05</span>旅行</button>
      <button class="side-item" data-view="works" type="button"><span class="mono">06</span>開發成果</button>
      <button class="side-item" data-view="publish" type="button"><span class="mono">07</span>發布</button>
    </nav>

    <div class="side-foot">
      <a class="side-link" href="../index.html" target="_blank" rel="noopener">檢視網站 ↗</a>
      <button class="side-link" id="logoutBtn" type="button">登出</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h2 class="topbar-title" id="viewTitle">網站設定</h2>
        <p class="topbar-sub mono" id="viewSub"></p>
      </div>
      <div class="topbar-right">
        <span class="dirty" id="dirtyFlag" hidden>未發布的變更</span>
        <button class="btn btn-ghost btn-sm" id="reloadBtn" type="button">重新載入</button>
        <button class="btn btn-primary btn-sm" id="quickPublish" type="button">發布</button>
      </div>
    </header>

    <div class="canvas" id="canvas"></div>
  </main>
</div>

<!-- ================= TOAST ================= -->
<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

<!-- ================= CONFIRM ================= -->
<dialog class="modal" id="confirmModal">
  <div class="modal-inner">
    <h3 class="modal-title" id="confirmTitle">確認</h3>
    <p class="modal-text" id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" id="confirmNo" type="button">取消</button>
      <button class="btn btn-primary btn-sm" id="confirmYes" type="button">確定</button>
    </div>
  </div>
</dialog>

<script src="admin.js"></script>
</body>
</html>
